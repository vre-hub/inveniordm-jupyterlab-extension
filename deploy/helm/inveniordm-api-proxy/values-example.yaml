# Worked example: three proxy releases, one per InvenioRDM instance.
#
# Each block below is a SEPARATE `helm install`, not a single values file:
#
#   helm install inveniordm-proxy-zenodo  ./deploy/helm/inveniordm-api-proxy \
#       -n <namespace> -f values-zenodo.yaml
#   helm install inveniordm-proxy-cds     ./deploy/helm/inveniordm-api-proxy \
#       -n <namespace> -f values-cds.yaml
#   helm install inveniordm-proxy-sandbox ./deploy/helm/inveniordm-api-proxy \
#       -n <namespace> -f values-zenodo-sandbox.yaml
#
# Note the distinct host and sessionCookieName in each: sharing either between
# releases breaks the login flow.

# --- values-zenodo.yaml -----------------------------------------------------
# image:
#   tag: "0.1.0"
# inveniordm:
#   baseUrl: https://zenodo.org
#   sessionCookieName: zenodo_proxy_session
# oauth:
#   clientId: "<client id of the Zenodo OAuth application>"
#   existingSecret: inveniordm-proxy-zenodo-oauth
# ingress:
#   className: nginx
#   host: inveniordm-proxy-zenodo.example.org
#   annotations:
#     cert-manager.io/cluster-issuer: letsencrypt
# proxy:
#   allowedCorsOrigins:
#     - https://jupyter.example.org
#   allowedReturnHosts:
#     - jupyter.example.org

